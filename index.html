<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>TrOCR 논문 발표</title>
<!-- Render의 Publish Directory가 저장소 최상위(.)로 잡혀 있어도 발표 사이트가 열리도록 site/로 보낸다.
     슬라이드 번호(#s5 등)는 그대로 넘긴다. Publish Directory를 site로 바꾸면 이 파일은 쓰이지 않는다. -->
<script>location.replace("site/" + location.hash);</script>
<meta http-equiv="refresh" content="0; url=site/">
</head>
<body><a href="site/">발표 사이트로 이동</a></body>
</html>
